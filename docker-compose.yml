services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing_dev_only
      POSTGRES_DB: marketing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://marketing:marketing_dev_only@db:5432/marketing}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-openai}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ORG_ROLES_CLAIM: ${OIDC_ORG_ROLES_CLAIM:-org_roles}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - "./apps/web:/app"
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
