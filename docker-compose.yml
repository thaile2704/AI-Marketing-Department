services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing_dev_only
      POSTGRES_DB: marketing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
    volumes: ["./apps/web:/app"]
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
volumes:
  pgdata:
